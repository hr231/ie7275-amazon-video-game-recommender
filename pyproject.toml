[project]
name = "vgrec"
version = "0.1.0"
description = "IE7275 Group 5: hybrid Top-K recommender for Amazon Reviews 2023 Video Games"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
    { name = "Liam Campbell" },
    { name = "Harshitkumar Brahmbhatt" },
    { name = "Hemanth Karthik Devakivada" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "implicit>=0.7.2",
    "torch>=2.3",
    "threadpoolctl>=3.2",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.scripts]
vgrec = "vgrec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vgrec"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
